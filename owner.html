<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner · New Terrain Creative</title>

<!-- Internal. Nothing links here, nothing should index it, and vercel.json
     sends the same instruction as a header.

     NO Meta pixel and NO /assets/track.js, on purpose. Our own visits to
     our own dashboard are not traffic, and a pixel here would put the
     owners into the ad account's audiences. scripts/preflight.py exempts
     this page from the pixel check for that reason. -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">

<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --black:#0A0A0A; --raised:#111010; --rail:#191817;
    --gold:#C8A96E; --gold-dim:#A08A57;
    --parchment:#F5F0E8; --soft:#A09890; --muted:#8B847D; --faint:#5F5A55;
    --line:#1e1e1e; --line-strong:#2a2826;
    --ok:#8FBF9A; --warn:#D9A866;
    --display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
    --body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  html { -webkit-text-size-adjust:100%; }
  body {
    background:var(--black); color:var(--parchment);
    font-family:var(--body); font-weight:300; font-size:15px; line-height:1.5;
    min-height:100vh;
  }
  [hidden] { display:none !important; }
  .wrap { max-width:1080px; margin:0 auto; padding:0 16px 72px; }

  header.top {
    display:flex; align-items:baseline; justify-content:space-between; gap:16px;
    padding:24px 0 16px; border-bottom:1px solid var(--line);
  }
  .brand { font-family:var(--display); font-size:26px; font-weight:300; letter-spacing:.01em; }
  .brand em { color:var(--gold); font-style:italic; }
  .linkish {
    background:none; border:0; color:var(--muted); font:inherit; font-size:13px;
    cursor:pointer; text-decoration:underline; text-underline-offset:3px;
  }
  .linkish:hover { color:var(--parchment); }

  /* ── sign in ─────────────────────────────────────────────────────── */
  .gate { max-width:360px; margin:16vh auto 0; }
  .gate h1 { font-family:var(--display); font-weight:300; font-size:34px; margin-bottom:6px; }
  .gate p { color:var(--soft); margin-bottom:24px; }
  label.field { display:block; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
  input[type=password], input[type=date] {
    width:100%; background:var(--raised); border:1px solid var(--line-strong); color:var(--parchment);
    font:inherit; padding:12px 14px; border-radius:2px; color-scheme:dark;
  }
  input:focus-visible, button:focus-visible, summary:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  .btn {
    display:inline-block; background:var(--gold); color:var(--black); border:0; cursor:pointer;
    font:inherit; font-weight:500; font-size:13px; letter-spacing:.08em; text-transform:uppercase;
    padding:13px 22px; border-radius:2px; margin-top:16px; width:100%;
  }
  .btn:disabled { opacity:.5; cursor:default; }
  .error { color:#E0A08A; font-size:14px; margin-top:10px; }
  .error:empty { display:none; }

  /* ── controls ────────────────────────────────────────────────────── */
  .controls { display:flex; flex-wrap:wrap; gap:10px 20px; align-items:center; justify-content:space-between; padding:16px 0 0; }
  .seg { display:flex; flex-wrap:wrap; gap:2px; background:var(--raised); border:1px solid var(--line-strong); border-radius:4px; padding:3px; }
  .seg button {
    background:none; border:0; color:var(--soft);
    font:inherit; font-size:13px; padding:6px 13px; border-radius:2px; cursor:pointer;
  }
  .seg button:hover { color:var(--parchment); }
  .seg button[aria-pressed=true] { color:var(--black); background:var(--gold); font-weight:500; }
  .custom { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:flex-end; padding-top:10px; }
  .custom input { width:auto; padding:6px 8px; font-size:13px; }
  .custom span { color:var(--muted); font-size:13px; }
  .rangeline { color:var(--muted); font-size:12px; padding-top:10px; }

  /* ── KPI grid ────────────────────────────────────────────────────── */
  .kpis { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:10px; margin-top:16px; }
  .kpis.six { grid-template-columns:repeat(3, minmax(0, 1fr)); }
  .kpi { background:var(--raised); border:1px solid var(--line); border-radius:4px; padding:16px 16px 14px; min-width:0; }
  .kpi .k { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  .kpi .v { font-family:var(--display); font-size:40px; font-weight:300; line-height:1.15; margin-top:6px; font-variant-numeric:tabular-nums lining-nums; }
  .kpi .v.blank { color:var(--faint); }
  .kpi .s { font-size:12px; color:var(--muted); margin-top:2px; min-height:18px; }
  .mark { color:var(--gold-dim); }

  /* ── sections ────────────────────────────────────────────────────── */
  h2 { font-family:var(--display); font-weight:300; font-size:24px; margin:40px 0 2px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:14px; }

  /* ── funnel, one progression ─────────────────────────────────────── */
  .funnel { position:relative; }
  .step {
    display:grid; grid-template-columns:18px 132px minmax(60px, 1fr) 64px 118px; gap:12px; align-items:center;
    padding:9px 0; position:relative;
  }
  /* the rail that ties the steps into one path */
  .step .dot { width:9px; height:9px; border-radius:50%; background:var(--gold); justify-self:center; position:relative; z-index:1; }
  .step.blank .dot { background:var(--black); box-shadow:inset 0 0 0 1.5px var(--faint); }
  .step::before { content:''; position:absolute; left:8.5px; top:0; bottom:0; width:1px; background:var(--line-strong); }
  .step:first-child::before { top:50%; }
  .step:last-child::before { bottom:50%; }
  .step .name { font-size:14px; }
  .step.depth .name { color:var(--soft); }
  .track { height:18px; background:var(--rail); border-radius:0 4px 4px 0; overflow:hidden; }
  .bar { height:100%; background:var(--gold); border-radius:0 4px 4px 0; min-width:2px; }
  .step.depth .bar { background:var(--gold-dim); }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .num.count { font-size:16px; font-weight:400; }
  .num.count.blank { color:var(--faint); }
  .conv { text-align:right; font-size:13px; color:var(--soft); font-variant-numeric:tabular-nums; }
  .conv b { color:var(--parchment); font-weight:400; }
  .conv small { color:var(--muted); font-size:12px; }

  /* ── campaign table ──────────────────────────────────────────────── */
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; min-width:720px; }
  th, td { padding:10px 14px 10px 0; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; font-variant-numeric:tabular-nums; }
  th:last-child, td:last-child { padding-right:0; }
  th { color:var(--muted); font-weight:400; font-size:11px; letter-spacing:.08em; text-transform:uppercase; border-bottom-color:var(--line-strong); }
  th:first-child, td:first-child { text-align:left; white-space:normal; min-width:190px; }
  td:first-child { font-size:14px; }
  td:first-child small { display:block; color:var(--muted); font-size:12px; }
  tr.untagged td { color:var(--muted); }
  tr.untagged td:first-child { font-style:italic; }
  td.blank { color:var(--faint); }
  tbody tr:hover td { background:var(--raised); }
  .empty { color:var(--muted); padding:24px 0; text-align:left; }

  /* ── status strip ────────────────────────────────────────────────── */
  .health { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:1px; margin-top:44px; border:1px solid var(--line); border-radius:4px; overflow:hidden; background:var(--line); }
  .health div { background:var(--black); padding:10px 14px; font-size:12px; color:var(--muted); min-width:0; }
  .health b { display:block; font-weight:400; font-size:13px; color:var(--parchment); }
  .health b::before { content:''; display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:8px; vertical-align:1px; background:var(--faint); }
  .health .ok b::before { background:var(--ok); }
  .health .warn b::before { background:var(--warn); }

  /* ── data notes ──────────────────────────────────────────────────── */
  details.notes { margin-top:12px; border:1px solid var(--line); border-radius:4px; }
  details.notes summary { list-style:none; cursor:pointer; padding:10px 14px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:baseline; font-size:13px; color:var(--soft); }
  details.notes summary::-webkit-details-marker { display:none; }
  details.notes summary .title { color:var(--parchment); }
  details.notes summary .title::before { content:'+'; display:inline-block; width:14px; color:var(--gold); }
  details.notes[open] summary .title::before { content:'−'; }
  details.notes summary .brief { color:var(--muted); font-size:12px; }
  details.notes summary .brief + .brief::before { content:'·'; margin-right:14px; color:var(--faint); }
  details.notes ul { padding:2px 14px 12px 28px; color:var(--muted); font-size:13px; border-top:1px solid var(--line); }
  details.notes li { padding:5px 0 0; }
  details.notes li::marker { color:var(--gold-dim); }

  @media (max-width:860px) {
    .kpis, .kpis.six { grid-template-columns:repeat(2, minmax(0, 1fr)); }
    .health { grid-template-columns:repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width:640px) {
    .controls { justify-content:flex-start; }
    .custom { justify-content:flex-start; }
    .step { grid-template-columns:18px 84px minmax(24px, 1fr) 46px 74px; gap:8px; }
    .step .name { font-size:13px; }
    .conv small { display:block; }
    .kpi { padding:14px 14px 12px; }
    .kpi .v { font-size:32px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- sign in -->
  <section class="gate" id="gate" hidden>
    <h1>Owner dashboard</h1>
    <p>New Terrain Creative, internal.</p>
    <form id="signin" autocomplete="on">
      <label class="field" for="pw">Password</label>
      <input type="password" id="pw" name="password" autocomplete="current-password" required>
      <button class="btn" type="submit" id="signin-btn">Sign in</button>
      <div class="error" id="gate-error" role="alert"></div>
    </form>
  </section>

  <!-- dashboard -->
  <section id="dash" hidden>
    <header class="top">
      <div class="brand">New Terrain <em>Owner</em></div>
      <button class="linkish" id="signout" type="button">Sign out</button>
    </header>

    <div class="controls">
      <div class="seg" id="offers" role="group" aria-label="Offer"></div>
      <div class="seg" id="presets" role="group" aria-label="Range">
        <button type="button" data-days="7">7 days</button>
        <button type="button" data-days="30">30 days</button>
        <button type="button" data-days="90">90 days</button>
        <button type="button" data-days="0" id="custom-toggle">Custom</button>
      </div>
    </div>
    <div class="custom" id="custom" hidden>
      <input type="date" id="from" aria-label="From">
      <span>to</span>
      <input type="date" id="to" aria-label="To">
    </div>
    <div class="rangeline" id="rangeline"></div>
    <div class="error" id="dash-error" role="alert"></div>

    <div id="report" hidden>
      <div class="kpis" id="kpis"></div>

      <h2>Funnel</h2>
      <div class="sub">Unique sessions at each step, with the share that carried on from the step before.</div>
      <div class="funnel" id="funnel"></div>

      <h2>By campaign and ad</h2>
      <div class="sub">Grouped on the UTM values the visitor first arrived with.</div>
      <div class="scroll"><table id="campaigns"></table></div>

      <div class="health" id="health"></div>

      <details class="notes" id="notes">
        <summary><span class="title">Data notes</span></summary>
        <ul id="notes-list"></ul>
      </details>
    </div>
  </section>
</div>

<script>
(function () {
  'use strict';

  var TZ = 'America/Los_Angeles';
  var DASH = '—';
  var OFFER_LABEL = {
    ad_sprint: 'Ad Sprint', paid_retainer: 'Paid retainer',
    founding_three: 'Founding Three', signature_work: 'Signature Work',
    production_media: 'Production media', brand_builder: 'Brand Builder',
    sales_enablement: 'Growth guide',
    organic_site: 'Organic site', '(unclassified)': 'Unclassified'
  };
  var OFFER_ORDER = ['ad_sprint', 'paid_retainer', 'founding_three', 'signature_work',
                     'brand_builder', 'production_media', 'organic_site', 'sales_enablement', '(unclassified)'];
  // Funnels whose page ends in a form of our own, so "leads" means something.
  var HAS_FORM = { paid_retainer: 1, founding_three: 1, signature_work: 1 };
  var VSL_EVENTS = ['vsl_play', 'vsl_25', 'vsl_50', 'vsl_75', 'vsl_90'];

  var state = { offer: null, from: null, to: null, days: 30, data: null };
  var $ = function (id) { return document.getElementById(id); };

  // ── small helpers ────────────────────────────────────────────────────
  // Everything rendered goes through textContent. Campaign and ad names
  // come from URL parameters, so they are whatever a visitor typed.
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'class') n.className = attrs[k];
      else if (k === 'text') n.textContent = attrs[k];
      else n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }

  function dayIn(tz, date) {
    return new Intl.DateTimeFormat('en-CA', { timeZone: tz }).format(date);
  }
  function shiftDay(day, delta) {
    var d = new Date(day + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() + delta);
    return d.toISOString().slice(0, 10);
  }
  function prettyDay(day) {
    return new Date(day + 'T12:00:00Z').toLocaleDateString('en-GB',
      { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
  }
  function shortDay(day) {
    return new Date(day + 'T12:00:00Z').toLocaleDateString('en-GB',
      { day: 'numeric', month: 'short', timeZone: 'UTC' });
  }
  function prettyTime(iso) {
    return new Date(iso).toLocaleString('en-GB',
      { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit', hour12: true, timeZone: TZ });
  }
  var int = new Intl.NumberFormat('en-US');
  var money = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 2 });
  function pct(a, b) {
    if (a == null || b == null || !b) return null;
    return (100 * a / b);
  }
  function pctText(v) { return v == null ? DASH : (v >= 10 ? v.toFixed(0) : v.toFixed(1)) + '%'; }

  // ── data shaping ─────────────────────────────────────────────────────
  var COUNT_KEYS = ['landing_sessions', 'vsl_plays', 'vsl_25', 'vsl_50', 'vsl_75', 'vsl_90',
                    'cta_sessions', 'cta_clicks', 'bookings', 'leads'];
  var PAID_KEYS = ['impressions', 'ad_clicks', 'spend'];

  function totals(rows) {
    var t = {};
    COUNT_KEYS.forEach(function (k) { t[k] = 0; });
    PAID_KEYS.forEach(function (k) { t[k] = null; });   // null until a real figure exists
    rows.forEach(function (r) {
      COUNT_KEYS.forEach(function (k) { t[k] += Number(r[k]) || 0; });
      PAID_KEYS.forEach(function (k) {
        if (r[k] != null) t[k] = (t[k] || 0) + Number(r[k]);
      });
    });
    return t;
  }

  /* When was this event first recorded? A count of 0 only means "none"
     if we were recording at the time. Before that it means "unknown", and
     the dashboard says so instead of printing a zero.

     Bookings are checked across every offer: the webhook writes all of
     them, so one booking anywhere proves the wiring was live. Everything
     else is checked within the offer, because not every page has a VSL. */
  function firstSeen(eventName, offer) {
    var first = null;
    (state.data.coverage || []).forEach(function (c) {
      if (c.event_name !== eventName) return;
      if (eventName !== 'schedule' && c.funnel !== offer) return;
      if (!first || c.first_seen < first) first = c.first_seen;
    });
    return first ? dayIn(TZ, new Date(first)) : null;
  }

  /** The most recent time any of these events was recorded, on any offer. */
  function lastSeen(eventNames) {
    var last = null;
    (state.data.coverage || []).forEach(function (c) {
      if (eventNames.indexOf(c.event_name) < 0) return;
      if (!last || c.last_seen > last) last = c.last_seen;
    });
    return last;
  }

  /** { value, na, since }. na: unavailable. since: partial, recorded from that day. */
  function metric(value, eventName, offer) {
    var first = firstSeen(eventName, offer);
    if (!first || first > state.to) return { value: null, na: true, first: first };
    return { value: value, na: false, since: first > state.from ? first : null };
  }

  /* A ratio is only honest when both halves cover the same days. Plays
     recorded for two days over landing sessions recorded for thirty is
     not a play rate, it is a wrong number, so it is withheld until the
     range starts where both were being recorded. */
  function comparable(a, b) {
    return !a.na && !b.na && (a.since || '') === (b.since || '');
  }
  function laterStart(a, b) {
    return [a.since, b.since, a.first, b.first].filter(Boolean).sort().pop();
  }

  function offersIn(data) {
    var seen = {};
    data.rows.forEach(function (r) { seen[r.funnel] = 1; });
    (data.coverage || []).forEach(function (c) { seen[c.funnel] = 1; });
    var known = OFFER_ORDER.filter(function (o) { return seen[o]; });
    var extra = Object.keys(seen).filter(function (o) { return OFFER_ORDER.indexOf(o) < 0; }).sort();
    return known.concat(extra);
  }

  // ── rendering ────────────────────────────────────────────────────────
  var notes = [];   // the full explanations, inside the disclosure
  var briefs = [];  // the few that show while it is closed
  function note(text) { if (notes.indexOf(text) < 0) notes.push(text); }
  function brief(text) { if (briefs.indexOf(text) < 0) briefs.push(text); }

  /* Why a figure is blank, in a few words. The full sentence goes into the
     data notes; this is what sits under the dash. */
  function whyBlank(m, awaiting) {
    return m.first ? 'Tracked from ' + shortDay(m.first) : awaiting;
  }

  function kpi(label, value, sub, blank) {
    return el('div', { class: 'kpi' }, [
      el('div', { class: 'k', text: label }),
      el('div', { class: 'v' + (blank ? ' blank' : ''), text: value }),
      el('div', { class: 's', text: sub || '' })
    ]);
  }
  function countKpi(label, m, awaiting, sub) {
    if (m.na) return kpi(label, DASH, whyBlank(m, awaiting), true);
    return kpi(label, int.format(m.value), m.since ? 'Since ' + shortDay(m.since) : sub);
  }
  function ratioKpi(label, a, b, sub) {
    if (comparable(a, b)) return kpi(label, pctText(pct(a.value, b.value)), sub, pct(a.value, b.value) == null);
    var from = (!a.na && !b.na) ? laterStart(a, b) : null;
    if (from) note(label + ' needs both of its figures for the same days. Start the range on ' +
      prettyDay(from) + ' or later to see it.');
    return kpi(label, DASH, from ? 'Not enough data before ' + shortDay(from) : 'Not enough data', true);
  }

  function render() {
    var data = state.data;
    notes = []; briefs = [];
    var offers = offersIn(data);
    if (!state.offer || offers.indexOf(state.offer) < 0) state.offer = offers[0] || null;

    // offer selector
    var seg = $('offers'); clear(seg);
    offers.forEach(function (o) {
      var b = el('button', { type: 'button', 'aria-pressed': String(o === state.offer), text: OFFER_LABEL[o] || o });
      b.addEventListener('click', function () { state.offer = o; render(); });
      seg.appendChild(b);
    });

    $('rangeline').textContent = prettyDay(state.from) + ' to ' + prettyDay(state.to) + ' · Pacific time';

    var rows = data.rows.filter(function (r) { return r.funnel === state.offer; });
    var t = totals(rows);
    var o = state.offer;
    var hasVsl = VSL_EVENTS.some(function (e) { return firstSeen(e, o); });
    var synced = data.spend_coverage && data.spend_coverage.first_day;

    var m = {
      landing: metric(t.landing_sessions, 'view_content', o),
      plays: metric(t.vsl_plays, 'vsl_play', o),
      v25: metric(t.vsl_25, 'vsl_25', o),
      v50: metric(t.vsl_50, 'vsl_50', o),
      v75: metric(t.vsl_75, 'vsl_75', o),
      v90: metric(t.vsl_90, 'vsl_90', o),
      cta: metric(t.cta_sessions, 'cta_click', o),
      booked: metric(t.bookings, 'schedule', o)
    };

    // ── KPIs ──
    var kpis = $('kpis'); clear(kpis);
    kpis.appendChild(countKpi('Landing sessions', m.landing, 'No visits recorded yet', 'Unique visitors'));
    if (hasVsl) {
      kpis.appendChild(countKpi('VSL plays', m.plays, 'No plays recorded yet', 'Pressed play'));
      kpis.appendChild(ratioKpi('Play rate', m.plays, m.landing, 'Plays / landing sessions'));
      kpis.appendChild(countKpi('Watched 50%', m.v50, 'No views recorded yet',
        comparable(m.v50, m.plays) && m.plays.value ? pctText(pct(m.v50.value, m.plays.value)) + ' of plays' : 'Reached halfway'));
    }
    kpis.appendChild(countKpi('CTA clicks', m.cta, 'No clicks recorded yet',
      comparable(m.cta, m.landing) && m.landing.value ? pctText(pct(m.cta.value, m.landing.value)) + ' of landing sessions' : 'Sessions that clicked'));
    kpis.appendChild(countKpi('Booked', m.booked, 'Awaiting first booking', 'Confirmed by iClosed'));
    kpis.appendChild(t.spend == null
      ? kpi('Ad spend', DASH, synced ? 'No Meta spend on this offer' : 'Awaiting first Meta spend', true)
      : kpi('Ad spend', money.format(t.spend), 'From Meta'));
    kpis.appendChild((t.spend == null || m.booked.na || !t.bookings)
      ? kpi('Cost per booking', DASH, 'Needs spend and bookings', true)
      : kpi('Cost per booking', money.format(t.spend / t.bookings), 'Spend / bookings'));
    kpis.className = 'kpis' + (kpis.children.length === 6 ? ' six' : '');

    // ── funnel ──
    // Each step names the step it is measured against: the one a visitor
    // has to pass through to get there. Watch depth chains from the play;
    // a CTA click comes from the page, not from the end of the video.
    var steps = [{ label: 'Landing', m: m.landing }];
    if (hasVsl) {
      steps.push({ label: 'Play', m: m.plays, from: m.landing, of: 'landing' });
      steps.push({ label: 'Watched 25%', m: m.v25, from: m.plays, of: 'plays', depth: true });
      steps.push({ label: 'Watched 50%', m: m.v50, from: m.v25, of: '25%', depth: true });
      steps.push({ label: 'Watched 75%', m: m.v75, from: m.v50, of: '50%', depth: true });
      steps.push({ label: 'Watched 90%', m: m.v90, from: m.v75, of: '75%', depth: true });
    }
    steps.push({ label: 'CTA click', m: m.cta, from: m.landing, of: 'landing' });
    var beforeBooked = { m: m.cta, of: 'CTA clicks' };
    if (HAS_FORM[o]) {
      var leads = { value: t.leads, na: false, since: null };
      steps.push({ label: 'Lead', m: leads, from: m.cta, of: 'CTA clicks' });
      beforeBooked = { m: leads, of: 'leads' };
    }
    steps.push({ label: 'Booked', m: m.booked, from: beforeBooked.m, of: beforeBooked.of });

    var top = Math.max.apply(null, steps.map(function (s) { return s.m.na ? 0 : s.m.value; }).concat([0]));
    var funnel = $('funnel'); clear(funnel);
    var partialUntil = null;   // the latest day any step began recording
    steps.forEach(function (s) {
      var mm = s.m;
      var track = el('div', { class: 'track' });
      if (!mm.na && top > 0 && mm.value > 0) {
        var bar = el('div', { class: 'bar' });
        bar.style.width = (100 * mm.value / top) + '%';
        track.appendChild(bar);
      }
      var count = mm.na
        ? el('div', { class: 'num count blank', text: DASH })
        : el('div', { class: 'num count', text: int.format(mm.value) });
      if (mm.since) count.appendChild(el('span', { class: 'mark', text: '*', title: 'Recorded since ' + prettyDay(mm.since) }));

      var conv = el('div', { class: 'conv' });
      if (s.from) {
        var v = comparable(mm, s.from) ? pct(mm.value, s.from.value) : null;
        if (v != null) {
          conv.appendChild(el('b', { text: pctText(v) }));
          conv.appendChild(el('small', { text: ' of ' + s.of }));
        } else {
          conv.textContent = DASH;
        }
      }
      funnel.appendChild(el('div', { class: 'step' + (s.depth ? ' depth' : '') + (mm.na ? ' blank' : '') }, [
        el('div', { class: 'dot' }), el('div', { class: 'name', text: s.label }), track, count, conv
      ]));

      if (mm.since) {
        note('* ' + s.label + ' has been recorded since ' + prettyDay(mm.since) +
          ', so earlier days in this range are missing from that figure.');
        if (!partialUntil || mm.since > partialUntil) partialUntil = mm.since;
      }
      if (mm.na) note(s.label + ' is unavailable: ' + (mm.first
        ? 'recording began ' + prettyDay(mm.first) + ', after this range.'
        : 'nothing has been recorded for it yet.'));
    });

    if (partialUntil) brief('Tracking coverage is partial before ' + shortDay(partialUntil));

    // ── campaign table ──
    var table = $('campaigns'); clear(table);
    var cols = ['Campaign', 'Landing'];
    if (hasVsl) cols.push('Plays', 'Play rate', '50%');
    cols.push('CTA', 'Booked', 'Spend', 'Per booking');
    table.appendChild(el('thead', {}, [el('tr', {}, cols.map(function (c) { return el('th', { text: c, scope: 'col' }); }))]));
    var body = el('tbody');
    rows.slice().sort(function (a, b) {
      return (b.landing_sessions - a.landing_sessions) || (b.bookings - a.bookings);
    }).forEach(function (r) {
      var untagged = r.campaign === '(none)';
      var first = el('td', { text: untagged ? 'Direct / unattributed' : r.campaign });
      var second = [];
      if (r.ad !== '(none)') second.push(r.ad);
      if (r.source !== '(none)') second.push(r.source);
      if (second.length) first.appendChild(el('small', { text: second.join(' · ') }));
      var cells = [first, cell(m.landing, r.landing_sessions)];
      if (hasVsl) {
        cells.push(cell(m.plays, r.vsl_plays));
        cells.push(textCell(comparable(m.plays, m.landing) ? pctText(pct(r.vsl_plays, r.landing_sessions)) : DASH));
        cells.push(cell(m.v50, r.vsl_50));
      }
      cells.push(cell(m.cta, r.cta_sessions), cell(m.booked, r.bookings));
      cells.push(textCell(r.spend == null ? DASH : money.format(r.spend)));
      cells.push(textCell((r.spend == null || m.booked.na || !Number(r.bookings)) ? DASH : money.format(r.spend / r.bookings)));
      body.appendChild(el('tr', untagged ? { class: 'untagged' } : {}, cells));
    });
    if (!rows.length) {
      body.appendChild(el('tr', {}, [el('td', { class: 'empty', colspan: String(cols.length), text: 'Nothing recorded for this offer in this range.' })]));
    }
    table.appendChild(body);

    // ── notes ──
    var sc = data.spend_coverage;
    var sync = data.spend_sync;
    var stale = sync && sync.last_synced_at && (Date.now() - new Date(sync.last_synced_at).getTime()) > 36 * 3600000;
    if (sync && sync.last_synced_at) {
      brief('Meta refreshed ' + prettyTime(sync.last_synced_at) + (stale ? ', out of date' : ''));
      note('Meta spend was last refreshed ' + prettyTime(sync.last_synced_at) + ' Pacific.' +
        (stale ? ' That is more than a day ago, so the daily sync is failing and recent spend is out of date.' : ''));
    }
    if (t.spend == null) {
      if (!synced) brief('Meta spend not yet available');
      note(sc && sc.first_day
        ? 'Ad spend is unavailable: no Meta spend is filed under this offer for this range. Meta figures on hand run ' +
          prettyDay(sc.first_day) + ' to ' + prettyDay(sc.last_day) + '. If ads were running, check the Unclassified tab and the UTM names on the ads.'
        : 'Ad spend is unavailable: no Meta totals have been imported yet.');
    } else if (sc && sc.first_day && (sc.first_day > state.from || sc.last_day < state.to)) {
      note('Meta figures on hand run ' + prettyDay(sc.first_day) + ' to ' + prettyDay(sc.last_day) +
        ', so spend and cost figures may cover only part of this range.');
    }
    if (!m.booked.na) {
      note('Bookings carry a campaign only when iClosed passes the UTM values through. Otherwise they sit under "Direct / unattributed".');
    }
    note('Every funnel step counts unique sessions. A visitor who replays the video or clicks twice counts once.');
    note('A ratio is shown only when both of its figures were being recorded for the same days. Otherwise it is left blank rather than calculated across different date ranges.');
    note('"Direct / unattributed" is traffic that arrived with no campaign tag: direct visits, organic links and untagged ads.');
    note('Days are Pacific time, both ends of the range included.');

    var summary = $('notes').querySelector('summary'); clear(summary);
    summary.appendChild(el('span', { class: 'title', text: 'Data notes' }));
    briefs.slice(0, 3).forEach(function (b) { summary.appendChild(el('span', { class: 'brief', text: b })); });
    var list = $('notes-list'); clear(list);
    notes.forEach(function (n) { list.appendChild(el('li', { text: n })); });

    renderHealth(sync, stale);
    $('report').hidden = false;
  }

  /* What is known to be flowing, read from the same coverage the report
     uses. "Active" means an event arrived recently; it is never claimed on
     the strength of the wiring alone. */
  function renderHealth(sync, stale) {
    var now = Date.now();
    function recent(iso, days) { return iso && (now - new Date(iso).getTime()) < days * 86400000; }
    function item(label, cls, status) {
      return el('div', { class: cls }, [el('b', { text: status }), document.createTextNode(label)]);
    }
    var site = lastSeen(['view_content', 'cta_click', 'landing_view']);
    var vsl = lastSeen(VSL_EVENTS);
    var booked = lastSeen(['schedule']);

    var health = $('health'); clear(health);
    health.appendChild(!site ? item('Site tracking', '', 'No events yet')
      : recent(site, 7) ? item('Site tracking', 'ok', 'Active')
      : item('Site tracking', 'warn', 'Quiet since ' + shortDay(dayIn(TZ, new Date(site)))));
    health.appendChild(!vsl ? item('VSL tracking', '', 'No plays yet')
      : recent(vsl, 14) ? item('VSL tracking', 'ok', 'Active')
      : item('VSL tracking', 'warn', 'Quiet since ' + shortDay(dayIn(TZ, new Date(vsl)))));
    health.appendChild(!booked ? item('iClosed bookings', '', 'Awaiting first booking')
      : item('iClosed bookings', 'ok', 'Last booking ' + shortDay(dayIn(TZ, new Date(booked)))));
    health.appendChild(!(sync && sync.last_synced_at) ? item('Meta sync', '', 'Awaiting first sync')
      : item('Meta sync', stale ? 'warn' : 'ok', (stale ? 'Out of date · ' : 'Refreshed ') + prettyTime(sync.last_synced_at)));
  }

  function textCell(text) {
    return el('td', text === DASH ? { class: 'blank', text: text } : { text: text });
  }
  function cell(m, v) {
    return textCell(m.na ? DASH : int.format(Number(v) || 0));
  }

  // ── loading ──────────────────────────────────────────────────────────
  function show(which) {
    $('gate').hidden = which !== 'gate';
    $('dash').hidden = which !== 'dash';
    if (which === 'gate') $('pw').focus();
  }

  function syncControls() {
    $('from').value = state.from; $('to').value = state.to;
    [].forEach.call($('presets').children, function (b) {
      b.setAttribute('aria-pressed', String(Number(b.getAttribute('data-days')) === state.days));
    });
    $('custom').hidden = state.days !== 0;
  }

  function load() {
    syncControls();
    $('dash-error').textContent = '';
    return fetch('/api/owner?from=' + state.from + '&to=' + state.to, { credentials: 'same-origin' })
      .then(function (r) {
        if (r.status === 401) { show('gate'); return null; }
        if (r.status === 503) {
          show('gate');
          $('gate-error').textContent = 'The dashboard is not configured yet. Set OWNER_DASHBOARD_PASSWORD in Vercel.';
          return null;
        }
        return r.json().then(function (body) {
          show('dash');
          if (!r.ok || !body.ok) {
            // Never render stale numbers under a failed request.
            $('report').hidden = true;
            $('dash-error').textContent = r.status === 502
              ? 'The report could not be loaded. Try again in a moment.'
              : (body.error || 'Something went wrong.');
            return null;
          }
          state.data = body;
          render();
        });
      })
      .catch(function () {
        show('dash');
        $('report').hidden = true;
        $('dash-error').textContent = 'Could not reach the server.';
      });
  }

  function setPreset(days) {
    state.days = days;
    state.to = dayIn(TZ, new Date());
    state.from = shiftDay(state.to, -(days - 1));
    load();
  }

  [].forEach.call($('presets').children, function (b) {
    b.addEventListener('click', function () {
      var days = Number(b.getAttribute('data-days'));
      if (days) return setPreset(days);
      // Custom: keep the range on screen and open the date fields.
      state.days = 0;
      syncControls();
      $('from').focus();
    });
  });
  ['from', 'to'].forEach(function (id) {
    $(id).addEventListener('change', function () {
      var f = $('from').value, t = $('to').value;
      if (!f || !t) return;
      if (f > t) { $('dash-error').textContent = 'The start date is after the end date.'; return; }
      state.from = f; state.to = t; state.days = 0;
      load();
    });
  });

  $('signin').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('signin-btn');
    btn.disabled = true;
    $('gate-error').textContent = '';
    fetch('/api/owner', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: $('pw').value })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (body) {
        btn.disabled = false;
        if (r.ok) { $('pw').value = ''; return load(); }
        $('gate-error').textContent =
          r.status === 401 ? 'That password is not right.' :
          r.status === 429 ? 'Too many attempts. Try again in 15 minutes.' :
          r.status === 503 ? 'The dashboard is not configured yet. Set OWNER_DASHBOARD_PASSWORD in Vercel.' :
          (body.error || 'Could not sign in.');
      });
    }).catch(function () {
      btn.disabled = false;
      $('gate-error').textContent = 'Could not reach the server.';
    });
  });

  $('signout').addEventListener('click', function () {
    fetch('/api/owner', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'logout' })
    }).then(function () { state.data = null; $('report').hidden = true; show('gate'); });
  });

  setPreset(30);
})();
</script>
</body>
</html>
